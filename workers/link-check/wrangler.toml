# Link checker for おうち時間の道具箱.
# このフォルダを足した変更ではデプロイしていない。Cron も入れていない。
# 公開と Cron は、社長の OK が出てから。
name = "ouchi-link-check"
main = "src/index.ts"
compatibility_date = "2026-11-04"

[vars]
# Public site origin, no trailing slash. Buy links are read from {SITE_ORIGIN}/sitemap.xml.
SITE_ORIGIN = "https://ouchi-dougubako.com"
# Optional https URL of { "links": [ { "url": "https://...", "page": "https://..." } ] }.
# Leave empty to read buy links from the sitemap pages instead.
LINK_SOURCE_URL = ""
# Leave empty. GET /run stays disabled until a secret is set. Do not commit the secret.
RUN_KEY = ""

# 楽天のアプリ ID とアクセスキーは、このファイルに書かない。
# 社長が公開するときに、次で秘密情報として入れる。
#   npx wrangler secret put RAKUTEN_APP_ID
#   npx wrangler secret put RAKUTEN_ACCESS_KEY

# After `npx wrangler kv namespace create LINK_REPORTS`, uncomment and paste the id.
# While this block is commented out, the report is written only to Worker logs.
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
